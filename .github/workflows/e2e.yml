# E2E Playwright — nightly / manual (no en cada PR)
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  playwright:
    name: Backend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ordenes_compra_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: 'true'
      NODE_ENV: test
      SKIP_DB_EAGER_CHECK: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ordenes_compra_test
      JWT_SECRET: test_jwt_secret_min_32_chars_xxxxxx
      JWT_EXPIRES_IN: 1h
      SECRET_ENCRYPTION_KEY: '12345678901234567890123456789012'
      EMAIL_MOCK: '1'
      E2E_PORT: '3999'
      E2E_HOST: '127.0.0.1'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Subir reporte HTML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/playwright-report
          retention-days: 7
