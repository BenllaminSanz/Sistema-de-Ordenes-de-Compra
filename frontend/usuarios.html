<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">
      <div class="card">
        <div class="d-flex align-center justify-between" style="margin-bottom:16px">
          <div class="card-title mb-0">Usuarios del sistema</div>
          <button class="btn btn-primary btn-sm"
                  onclick="UI.abrirModal('modal-usuario')">+ Nuevo usuario</button>
        </div>
        <div id="tabla-usuarios"></div>
      </div>
    </main>
  </div>
</div>

<!-- ── Modal: Usuario ─────────────────────────────────────────── -->
<div class="modal-backdrop" id="modal-usuario">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title">Nuevo usuario</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-usuario')">×</button>
    </div>
    <form id="form-usuario">
      <div class="form-group">
        <label class="form-label">Nombre completo *</label>
        <input type="text" id="usr-nombre" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Correo electrónico *</label>
        <input type="email" id="usr-email" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña * (mín. 8 caracteres)</label>
        <input type="password" id="usr-password" class="form-control" minlength="8" required>
      </div>
      <div class="form-group">
        <label class="form-label">Rol *</label>
        <select id="usr-rol" class="form-control" required>
          <option value="solicitante">Solicitante</option>
          <option value="contabilidad">Contabilidad</option>
          <option value="gerente">Gerente</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline"
                onclick="UI.cerrarModal('modal-usuario')">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-usr">Crear usuario</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script>
Auth.requiereAuth();
if (!Auth.puedeHacer(['admin'])) window.location.href = 'dashboard.html';
renderSidebar();
renderTopbar('Usuarios');
cargarUsuarios();

async function cargarUsuarios() {
  const contenedor = document.getElementById('tabla-usuarios');
  UI.spinner(contenedor);
  try {
    const usuarios = await Api.get('/auth/usuarios');
    contenedor.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Desde</th><th>Acciones</th>
          </tr></thead>
          <tbody>${usuarios.map(u => `
            <tr>
              <td class="fw-600">${u.nombre}</td>
              <td>${u.email}</td>
              <td><span class="badge badge-en_revision">${u.rol}</span></td>
              <td>${u.activo
                    ? '<span class="badge badge-aprobado">Activo</span>'
                    : '<span class="badge badge-rechazado">Inactivo</span>'}</td>
              <td class="text-muted text-sm">${UI.fecha(u.created_at)}</td>
              <td>
                <button class="btn btn-sm ${u.activo ? 'btn-danger' : 'btn-success'}"
                        onclick="toggleUsuario(${u.id}, ${u.activo})">
                  ${u.activo ? 'Desactivar' : 'Activar'}
                </button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (err) {
    UI.empty(contenedor, 'Error al cargar usuarios');
    Toast.error(err.mensaje || 'Error');
  }
}

document.getElementById('form-usuario').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-guardar-usr');
  btn.disabled = true;
  try {
    await Api.post('/auth/registro', {
      nombre:   document.getElementById('usr-nombre').value,
      email:    document.getElementById('usr-email').value,
      password: document.getElementById('usr-password').value,
      rol:      document.getElementById('usr-rol').value,
    });
    UI.cerrarModal('modal-usuario');
    Toast.success('Usuario creado correctamente');
    cargarUsuarios();
  } catch (err) {
    Toast.error(err.mensaje || 'Error al crear usuario');
  } finally {
    btn.disabled = false;
  }
});

async function toggleUsuario(id, activo) {
  try {
    await Api.patch(`/auth/usuarios/${id}/estado`, { activo: !activo });
    Toast.success(`Usuario ${!activo ? 'activado' : 'desactivado'}`);
    cargarUsuarios();
  } catch (err) {
    Toast.error(err.mensaje || 'Error');
  }
}
</script>
</body>
</html>
