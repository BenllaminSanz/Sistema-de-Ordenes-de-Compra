<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Áreas y Departamentos — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .area-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .area-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface, #f8fafc);
      cursor: pointer;
      user-select: none;
    }
    .area-header:hover { background: #f1f5f9; }
    .area-chevron { transition: transform .2s; color: var(--muted); flex-shrink: 0; }
    .area-card.open .area-chevron { transform: rotate(90deg); }
    .area-label { flex: 1; font-weight: 600; font-size: 14px; }
    .area-id-badge {
      font-size: 10px; font-family: monospace; font-weight: 700;
      background: #e6f1fb; color: var(--primary);
      padding: 2px 6px; border-radius: 4px;
    }
    .area-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .deptos-body { display: none; padding: 8px 16px 14px; border-top: 1px solid var(--border); }
    .area-card.open .deptos-body { display: block; }
    .depto-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 6px; font-size: 13px;
    }
    .depto-row:hover { background: #f8fafc; }
    .depto-codigo {
      font-family: monospace; font-size: 11px; font-weight: 600;
      color: var(--primary); min-width: 52px;
    }
    .depto-nombre { flex: 1; }
    .depto-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .depto-empty { font-size: 12px; color: var(--muted); padding: 8px 4px; font-style: italic; }
    .modal-sm .modal-box { max-width: 420px; }
    .historial-card { margin-top: 16px; }
  </style>
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>
  <div style="flex:1">
    <header id="topbar"></header>
    <main id="main-content">
      <div class="card">
        <div class="page-header">
          <div>
            <h2 class="page-title">Áreas y Departamentos</h2>
            <p class="text-muted" style="margin:4px 0 0;font-size:13px;">
              Catálogo alineado a DataTextNow. Los cambios quedan registrados en el historial.
            </p>
          </div>
          <button class="btn btn-primary btn-sm" onclick="abrirModalArea()">+ Nueva área</button>
        </div>
        <div id="lista-areas"><div class="spinner" style="margin:40px auto;"></div></div>
      </div>

      <div class="card historial-card">
        <div class="card-title" style="margin-bottom:10px">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          Historial de cambios
        </div>
        <div id="historial-areas"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal-backdrop modal-sm" id="modal-area">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-area-titulo">Nueva área</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-area')">×</button>
    </div>
    <form id="form-area" onsubmit="submitArea(event)">
      <div style="padding:16px 24px;">
        <input type="hidden" id="area-id" value="">
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Nombre del área *
            <span style="font-size:10.5px;color:var(--muted);font-weight:400;">(ID = nombre visible)</span>
          </label>
          <input type="text" id="area-label" class="form-control" placeholder="ADMINISTRACIÓN" required
                 style="text-transform:uppercase;"
                 oninput="this.value=this.value.toUpperCase()">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.cerrarModal('modal-area')">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-area">Crear área</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop modal-sm" id="modal-depto">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-depto-titulo">Nuevo departamento</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-depto')">×</button>
    </div>
    <form id="form-depto" onsubmit="submitDepto(event)">
      <div style="padding:16px 24px;">
        <div class="form-group">
          <label class="form-label">Nombre del departamento *</label>
          <input type="text" id="depto-nombre" class="form-control"
                 placeholder="PRODUCCIÓN TURNO NOCHE" style="text-transform:uppercase;"
                 oninput="this.value=this.value.toUpperCase()" required>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Código DataTextNow
            <span style="font-size:10.5px;color:var(--muted);font-weight:400;">opcional</span>
          </label>
          <input type="text" id="depto-codigo" class="form-control" placeholder="00001"
                 style="text-transform:uppercase;"
                 oninput="this.value=this.value.toUpperCase()">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.cerrarModal('modal-depto')">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-depto">Agregar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/pages/areas.js"></script>
</body>
</html>
