<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* ── Grid de KPIs ────────────────────────────────────────── */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }
    @media (max-width: 900px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .metrics-grid { grid-template-columns: 1fr; }
    }

    /* ── Layout de dos columnas del dashboard ─────────────────── */
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 16px;
      align-items: start;
    }
    .dash-col-right {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (max-width: 1100px) {
      .dash-grid { grid-template-columns: 1fr; }
      .dash-col-right { display: grid; grid-template-columns: 1fr 1fr; }
    }

    /* ── Encabezado del dashboard ─────────────────────────────── */
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dash-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin: 0;
      letter-spacing: -0.3px;
    }
    .dash-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── KPI cards mejorados ──────────────────────────────────── */
    .kpi-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--kpi-color, var(--primary));
    }
    .kpi-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background: var(--kpi-bg, #E6F1FB);
      margin-bottom: 2px;
      flex-shrink: 0;
    }
    .kpi-card .label {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .2px;
    }
    .kpi-card-pulse {
      box-shadow: 0 0 0 2px #fdba74, var(--card-shadow);
    }
    .kpi-card .value {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1;
    }
    .kpi-card .sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Barra de distribución mejorada ───────────────────────── */
    .dist-row {
      margin-bottom: 14px;
    }
    .dist-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 5px;
    }
    .dist-bar-bg {
      background: #f1f5f9;
      border-radius: 4px;
      height: 7px;
      overflow: hidden;
    }
    .dist-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width .4s ease;
    }
    .dist-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── Aging badge de días ──────────────────────────────────── */
    .badge-dias-ok   { background:#dcfce7; color:#166534; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }
    .badge-dias-warn { background:#fef9c3; color:#854d0e; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }
    .badge-dias-crit { background:#fee2e2; color:#991b1b; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; white-space:nowrap; }

    /* ── Botón export (oculto hasta validar rol contab/admin) ── */
    #btn-reporte { display: none; }

    /* ── Card sin margen inferior (para columna derecha) ─────── */
    .card-flush { margin-bottom: 0; }

    /* ── Sparkline inline ─────────────────────────────────────── */
    .sparkline-wrap { margin-top: 6px; opacity: .85; }

    /* ── tabla compacta ───────────────────────────────────────── */
    .table-sm td, .table-sm th { padding: 7px 10px; font-size: 12.5px; }
    .table-sm th { font-size: 11px; }

    /* ── Bandeja de trabajo (Dashboard) ───────────────────────── */
    .bandeja-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .bandeja-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
    }
    .bandeja-tab:hover { border-color: #93c5fd; color: var(--primary); }
    .bandeja-tab.active {
      background: #e6f1fb;
      border-color: #93c5fd;
      color: #185FA5;
    }
    .bandeja-tab-count {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      text-align: center;
      background: #f1f5f9;
      color: #475569;
    }
    .bandeja-tab.active .bandeja-tab-count {
      background: #185FA5;
      color: #fff;
    }
    .bandeja-tab.has-items:not(.active) .bandeja-tab-count {
      background: #ffedd5;
      color: #c2410c;
    }
    .bandeja-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-end;
    }
    .bandeja-actions .btn { white-space: nowrap; }
    #card-bandeja:target,
    #card-bandeja.bandeja-focus,
    #card-bandeja-oc:target,
    #card-bandeja-oc.bandeja-focus {
      box-shadow: 0 0 0 2px #fdba74, var(--card-shadow);
    }
  </style>
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">

      <!-- ── Encabezado con selector de año y reporte discreto ── -->
      <div class="dash-header">
        <h1 id="dash-titulo">Dashboard</h1>
        <div class="dash-header-actions">
          <select id="dash-anio" class="form-control"
                  style="width:92px;height:32px;font-size:13px;display:inline-block">
          </select>
          <!-- Export BASE GRAL — solo visible para compras/admin -->
          <button type="button" id="btn-reporte" class="btn btn-outline btn-sm"
                  title="Exportar BASE GRAL del año: todos los REQ y OC">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Exportar Excel
          </button>
        </div>
      </div>

      <!-- ── KPI Cards ─────────────────────────────────────────── -->
      <div class="metrics-grid" id="metrics" style="margin-bottom:18px"></div>

      <!-- ── Grid principal: tablas izq · analytics der ─────── -->
      <div class="dash-grid">

        <!-- Columna izquierda: lo accionable primero -->
        <div>

          <!-- Bandeja de trabajo (Compras / Mis pendientes) -->
          <div class="card" id="card-bandeja" style="margin-bottom:16px">
            <div class="card-title" style="flex-wrap:wrap; gap:8px;">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24" style="color:#c2410c">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
              </svg>
              <span id="bandeja-titulo">Bandeja Compras</span>
              <span id="bandeja-count"
                    style="margin-left:2px;font-size:11px;background:#ffedd5;color:#c2410c;
                           padding:1px 7px;border-radius:999px;font-weight:600;display:none"></span>
              <a href="requerimientos.html?estado=activos" id="bandeja-link-todos"
                 class="btn btn-sm btn-outline" style="margin-left:auto">Ver en listado →</a>
            </div>
            <div class="bandeja-tabs" id="bandeja-tabs" role="tablist"></div>
            <div id="tabla-bandeja"></div>
          </div>

          <!-- Bandeja OC (colas por estado) -->
          <div class="card" id="card-bandeja-oc" style="margin-bottom:0">
            <div class="card-title" style="flex-wrap:wrap; gap:8px;">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24" style="color:#7c3aed">
                <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
              </svg>
              <span id="oc-activas-titulo">Bandeja OC</span>
              <span id="oc-activas-count"
                    style="margin-left:2px;font-size:11px;background:#ede9fe;color:#5b21b6;
                           padding:1px 7px;border-radius:999px;font-weight:600;display:none"></span>
              <a href="ordenes.html?estado=activas" id="bandeja-oc-link-todos"
                 class="btn btn-sm btn-outline" style="margin-left:auto">Ver en listado →</a>
            </div>
            <div class="bandeja-tabs" id="bandeja-oc-tabs" role="tablist"></div>
            <div id="tabla-oc"></div>
          </div>

        </div>

        <!-- Columna derecha: analítica compacta -->
        <div class="dash-col-right">

          <!-- Gasto por tipo -->
          <div class="card card-flush">
            <div class="card-title" style="margin-bottom:10px">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
              Gasto por tipo <span id="anio-tipo" style="font-weight:400;color:var(--muted);font-size:12px"></span>
            </div>
            <div id="dist-tipo"></div>
          </div>

          <!-- Top proveedores -->
          <div class="card card-flush">
            <div class="card-title" style="margin-bottom:10px">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 010 7.75"/>
              </svg>
              Top proveedores MXN
            </div>
            <div id="top-proveedores"></div>
          </div>

          <!-- Top departamentos -->
          <div class="card card-flush">
            <div class="card-title" style="margin-bottom:10px">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
              </svg>
              Más activos por área / depto
            </div>
            <div id="top-departamentos"></div>
          </div>

        </div>
      </div><!-- /dash-grid -->

    </main>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
