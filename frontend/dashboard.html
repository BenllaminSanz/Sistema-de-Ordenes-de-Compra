<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">
      <div class="metrics-grid" id="metrics"></div>

      <!-- Reporte principal visible a primera vista (solo contabilidad/admin) -->
      <div class="card" id="reporte-status-card" style="display:none; border-left: 5px solid #185FA5;">
        <div class="card-title">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
          </svg>
          Reporte STATUS 2025 POS HILOS
        </div>
        <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
          <div style="flex:1; min-width:240px;">
            <p style="margin:0; font-size:13px; color:#475569; line-height:1.4;">
              Reporte consolidado por línea (el utilizado en contabilidad). Incluye estado de recepciones, montos, proveedores y STATUS.
            </p>
          </div>
          <button id="btn-descargar-status" class="btn btn-primary" style="white-space:nowrap; padding:10px 18px;">
            📊 Descargar STATUS 2025 POS HILOS (Excel)
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-title" id="titulo-req">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0
               002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg>
          Requerimientos pendientes de revisión
        </div>
        <div id="tabla-req"></div>
      </div>

      <div class="card">
        <div class="card-title" id="titulo-oc">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          Órdenes de compra recientes
        </div>
        <div id="tabla-oc"></div>
      </div>

    </main>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
