<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">
      <div class="metrics-grid" id="metrics"></div>

      <div class="card">
        <div class="card-title" id="titulo-oc">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          Órdenes de compra recientes
        </div>
        <div id="tabla-oc"></div>
      </div>

      <div class="card">
        <div class="card-title" id="titulo-req">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0
               002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/></svg>
          Requerimientos pendientes de revisión
        </div>
        <div id="tabla-req"></div>
      </div>

      <!-- Reporte de Órdenes de Compra (solo contabilidad y admin) -->
      <div class="card" id="reporte-card" style="display:none;">
        <div class="card-title">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
          </svg>
          Reporte de Órdenes de Compra
        </div>

        <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;">
          <div>
            <label class="form-label">Tipo de período</label>
            <select id="rep-tipo" class="form-control" style="width:auto;">
              <option value="anual">Anual</option>
              <option value="mensual">Mensual</option>
              <option value="semanal">Semanal</option>
            </select>
          </div>

          <div id="rep-anio-container">
            <label class="form-label">Año</label>
            <input type="number" id="rep-anio" class="form-control" value="2025" style="width:100px;">
          </div>

          <div id="rep-mes-container" style="display:none;">
            <label class="form-label">Mes</label>
            <select id="rep-mes" class="form-control" style="width:auto;">
              <option value="1">Enero</option><option value="2">Febrero</option>
              <option value="3">Marzo</option><option value="4">Abril</option>
              <option value="5">Mayo</option><option value="6">Junio</option>
              <option value="7">Julio</option><option value="8">Agosto</option>
              <option value="9">Septiembre</option><option value="10">Octubre</option>
              <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
          </div>

          <div id="rep-semana-container" style="display:none;">
            <label class="form-label">Semana</label>
            <input type="number" id="rep-semana" class="form-control" value="1" min="1" max="53" style="width:80px;">
          </div>

          <div style="margin-top:22px;">
            <button id="btn-generar-reporte" class="btn btn-primary">Descargar Excel</button>
          </div>
        </div>

        <div style="font-size:12px; color:#6b7280;">
          Solo Contabilidad y Administración pueden generar este reporte.
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
