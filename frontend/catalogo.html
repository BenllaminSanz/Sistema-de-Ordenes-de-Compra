<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">
      <div class="card">
        <div class="page-header">
          <div>
            <h2 class="page-title">Catálogo de Artículos y Servicios</h2>
          </div>
          <div class="page-header-actions" id="admin-actions" style="display:none">
            <button class="btn btn-outline btn-sm"
                    onclick="document.getElementById('input-excel-catalogo').click()">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24" style="vertical-align:-1px;margin-right:3px">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Cargar Excel
            </button>
            <button class="btn btn-primary btn-sm" onclick="abrirModalCatalogo()">
              + Nuevo elemento
            </button>
          </div>
          <input type="file" id="input-excel-catalogo" accept=".xlsx,.xls"
                 style="display:none" onchange="cargarCatalogoDesdeExcel(this)">
        </div>

        <div class="filters-bar">
          <div class="search-wrap">
            <svg class="search-icon" width="14" height="14" fill="none"
                 stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="busqueda" class="form-control search-input"
                   placeholder="Buscar por código o descripción…"
                   oninput="filtrarCatalogo(this.value)">
          </div>
          <select id="filtro-tipo" class="form-control" onchange="filtrarCatalogo()">
            <option value="">Todos los tipos</option>
            <option value="PARTES">Partes</option>
            <option value="SERVICIOS">Servicios</option>
            <option value="FLETES">Fletes</option>
          </select>
          <label class="chk-label">
            <input type="checkbox" id="chk-activos" checked onchange="cargarCatalogo()">
            Solo activos
          </label>
          <span id="cat-contador" class="filter-count"></span>
        </div>

        <div id="tabla-catalogo"></div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>

<!-- Modal: Crear / Editar elemento del Catálogo -->
<div class="modal-backdrop" id="modal-catalogo" style="display:none;">
  <div class="modal-box" style="max-width: 520px;">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-catalogo-titulo">Nuevo elemento</h3>
      <button class="modal-close" onclick="cerrarModalCatalogo()">×</button>
    </div>
    <form id="form-catalogo" onsubmit="guardarCatalogo(event)">
      <input type="hidden" id="catalogo-id">

      <div class="form-group">
        <label class="form-label">Tipo *</label>
        <select id="cat-tipo" class="form-control" required>
          <option value="">Selecciona tipo...</option>
          <option value="PARTES">Partes</option>
          <option value="SERVICIOS">Servicios</option>
          <option value="FLETES">Fletes</option>
        </select>
        <small class="text-danger" id="error-cat-tipo"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Código *</label>
        <input type="text" id="cat-codigo" class="form-control" required placeholder="Ej: MOT-150HP">
        <small class="text-danger" id="error-cat-codigo"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Descripción *</label>
        <textarea id="cat-descripcion" class="form-control" rows="3" required placeholder="Descripción detallada del artículo o servicio"></textarea>
        <small class="text-danger" id="error-cat-descripcion"></small>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label class="form-label">Costo de Referencia <span class="text-muted">(opcional)</span></label>
          <input type="number" id="cat-costo" class="form-control" step="0.01" min="0">
          <small class="text-danger" id="error-cat-costo"></small>
        </div>
        <div class="form-group">
          <label class="form-label">Moneda</label>
          <select id="cat-moneda" class="form-control">
            <option value="MXN">MXN - Peso Mexicano</option>
            <option value="USD">USD - Dólar Americano</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Proveedor (opcional)</label>
        <select id="cat-proveedor" class="form-control">
          <option value="">Sin proveedor asignado</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="cerrarModalCatalogo()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-catalogo">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/pages/catalogo.js"></script>
</body>
</html>
