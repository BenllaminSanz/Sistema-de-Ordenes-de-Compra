<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">
      <div class="card">
        <div class="page-header">
          <div>
            <h2 class="page-title">Catálogo de Artículos y Servicios</h2>
            <nav class="catalog-view-tabs" aria-label="Vista del catálogo">
              <a href="catalogo.html" class="catalog-view-tab active">Por ítems</a>
              <a href="catalogo-proveedores.html" class="catalog-view-tab">Por proveedor</a>
            </nav>
          </div>
          <div class="page-header-actions" id="admin-actions" style="display:none; flex-wrap:wrap; gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="exportarCatalogoExcel()" title="Descargar con el mismo formato de carga">
              ↓ Descargar Excel
            </button>
            <button class="btn btn-outline btn-sm"
                    onclick="document.getElementById('input-excel-catalogo').click()">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"
                   viewBox="0 0 24 24" style="vertical-align:-1px;margin-right:3px">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Cargar Excel
            </button>
            <button class="btn btn-outline btn-sm" onclick="abrirModalUnidades()">
              Unidades de medida
            </button>
            <button class="btn btn-primary btn-sm" onclick="abrirModalCatalogo()">
              + Nuevo elemento
            </button>
          </div>
          <input type="file" id="input-excel-catalogo" accept=".xlsx,.xls"
                 style="display:none" onchange="cargarCatalogoDesdeExcel(this)">
        </div>

        <div class="filters-bar">
          <div class="search-wrap">
            <svg class="search-icon" width="14" height="14" fill="none"
                 stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="search" id="busqueda" class="form-control search-input"
                   placeholder="Buscar por código, descripción o proveedor…"
                   oninput="filtrarCatalogo(this.value)">
          </div>
          <select id="filtro-tipo" class="form-control" onchange="filtrarCatalogo()">
            <option value="">Todos los tipos</option>
            <option value="PARTES">Partes</option>
            <option value="SERVICIOS">Servicios</option>
            <option value="FLETES">Fletes</option>
          </select>
          <div class="search-wrap" style="min-width:200px; flex:0 1 220px;">
            <input type="text" id="filtro-proveedor-busqueda" class="form-control"
                   list="filtro-proveedores-list"
                   placeholder="Proveedor (código o nombre)…"
                   autocomplete="off">
            <input type="hidden" id="filtro-proveedor-id">
            <datalist id="filtro-proveedores-list"></datalist>
          </div>
          <label class="chk-label">
            <input type="checkbox" id="chk-activos" checked onchange="cargarCatalogo()">
            Solo activos
          </label>
          <button type="button" class="btn btn-outline btn-sm" onclick="limpiarFiltrosYRecargar()" title="Quitar búsqueda y filtros">
            Limpiar filtros
          </button>
          <span id="cat-contador" class="filter-count"></span>
        </div>

        <div id="tabla-catalogo"></div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>

<!-- Barra flotante: carrito de requerimiento -->
<div id="carrito-req-bar" class="carrito-req-bar" style="display:none" aria-live="polite">
  <div class="carrito-req-bar-inner">
    <div class="carrito-req-bar-info">
      <span class="carrito-req-bar-icon">🛒</span>
      <div>
        <div class="carrito-req-bar-title" id="carrito-req-titulo">0 ítems en tu solicitud</div>
        <div class="carrito-req-bar-sub" id="carrito-req-sub"></div>
      </div>
    </div>
    <div class="carrito-req-bar-actions">
      <button type="button" class="btn btn-sm btn-outline" onclick="toggleDetalleCarritoReq()">Ver ítems</button>
      <button type="button" class="btn btn-sm btn-primary" onclick="CarritoReqUI.irACrearRequerimiento()">Crear requerimiento</button>
      <button type="button" class="btn btn-sm btn-outline" onclick="vaciarCarritoReq()" title="Vaciar solicitud">Vaciar</button>
    </div>
  </div>
  <div id="carrito-req-detalle" class="carrito-req-detalle" style="display:none"></div>
</div>

<!-- Modal: Crear / Editar elemento del Catálogo -->
<div class="modal-backdrop" id="modal-catalogo" style="display:none;">
  <div class="modal-box" style="max-width: 520px;">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-catalogo-titulo">Nuevo elemento</h3>
      <button class="modal-close" onclick="cerrarModalCatalogo()">×</button>
    </div>
    <form id="form-catalogo" onsubmit="guardarCatalogo(event)">
      <input type="hidden" id="catalogo-id">

      <div class="form-group">
        <label class="form-label">Tipo *</label>
        <select id="cat-tipo" class="form-control" required>
          <option value="">Selecciona tipo...</option>
          <option value="PARTES">Partes</option>
          <option value="SERVICIOS">Servicios</option>
          <option value="FLETES">Fletes</option>
        </select>
        <small class="text-danger" id="error-cat-tipo"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Código *</label>
        <input type="text" id="cat-codigo" class="form-control" required placeholder="Ej: MOT-150HP">
        <small class="text-danger" id="error-cat-codigo"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Descripción *</label>
        <textarea id="cat-descripcion" class="form-control" rows="3" required placeholder="Descripción detallada del artículo o servicio"></textarea>
        <small class="text-danger" id="error-cat-descripcion"></small>
      </div>

      <div class="form-group">
        <label class="form-label">Unidad de medida <span class="text-muted">(opcional)</span></label>
        <select id="cat-unidad" class="form-control">
          <option value="">— Seleccionar unidad —</option>
        </select>
        <small class="text-muted" style="font-size:11px;">Catálogo estandarizado. Gestiona unidades con el botón «Unidades de medida».</small>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label class="form-label">Costo de Referencia <span class="text-muted">(opcional)</span></label>
          <input type="number" id="cat-costo" class="form-control" step="0.01" min="0">
          <small class="text-danger" id="error-cat-costo"></small>
        </div>
        <div class="form-group">
          <label class="form-label">Moneda</label>
          <select id="cat-moneda" class="form-control">
            <option value="MXN">MXN - Peso Mexicano</option>
            <option value="USD">USD - Dólar Americano</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Proveedor (opcional)</label>
        <input type="text" id="cat-proveedor-busqueda" class="form-control"
               list="cat-proveedores-list"
               placeholder="Buscar por código o nombre…"
               autocomplete="off">
        <input type="hidden" id="cat-proveedor-id">
        <datalist id="cat-proveedores-list"></datalist>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="cerrarModalCatalogo()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-catalogo">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Unidades de medida -->
<div class="modal-backdrop" id="modal-unidades" style="display:none;">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-header">
      <h3 class="modal-title">Unidades de medida</h3>
      <button class="modal-close" onclick="cerrarModalUnidades()">×</button>
    </div>
    <form id="form-unidad" onsubmit="guardarUnidadMedida(event)" style="margin-bottom:14px;">
      <input type="hidden" id="unidad-id" value="">
      <div style="display:grid; grid-template-columns:1fr 1.4fr auto; gap:8px; align-items:end;">
        <div class="form-group" style="margin:0;">
          <label class="form-label">Código *</label>
          <input type="text" id="unidad-codigo" class="form-control" required placeholder="Ej. pza, kg">
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label">Nombre *</label>
          <input type="text" id="unidad-nombre" class="form-control" required placeholder="Ej. Pieza">
        </div>
        <button type="submit" class="btn btn-primary btn-sm" style="height:38px;">Guardar</button>
      </div>
    </form>
    <div id="lista-unidades-admin"></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" onclick="cerrarModalUnidades()">Cerrar</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/carrito-req.js"></script>
<script src="js/proveedor-busqueda.js"></script>
<script src="js/pages/catalogo.js"></script>
</body>
</html>
