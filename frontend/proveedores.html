<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">
      <div class="card">
        <div class="d-flex align-center justify-between" style="margin-bottom:16px">
          <div class="card-title mb-0">Proveedores</div>
          <div class="d-flex gap-2">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
              <input type="checkbox" id="chk-activos" checked onchange="cargarProveedores()">
              Solo activos
            </label>
            <button class="btn btn-primary btn-sm"
                    onclick="abrirModalProveedor()">+ Nuevo proveedor</button>
          </div>
        </div>

        <div id="tabla-proveedores"></div>
      </div>
    </main>
  </div>
</div>

<!-- ── Modal: Proveedor ───────────────────────────────────────── -->
<div class="modal-backdrop" id="modal-proveedor">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-prov-titulo">Nuevo proveedor</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-proveedor')">×</button>
    </div>
    <form id="form-proveedor">
      <div class="form-group">
        <label class="form-label">Nombre *</label>
        <input type="text" id="prov-nombre" class="form-control" required>
      </div>
      <div class="form-group">
        <label class="form-label">Correo electrónico *</label>
        <input type="email" id="prov-email" class="form-control" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="text" id="prov-telefono" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">RFC</label>
          <input type="text" id="prov-rfc" class="form-control" maxlength="13">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Dirección</label>
        <textarea id="prov-direccion" class="form-control" rows="2"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline"
                onclick="UI.cerrarModal('modal-proveedor')">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-prov">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script>
Auth.requiereAuth();
// Solo contabilidad y admin pueden acceder
if (!Auth.puedeHacer(['contabilidad','admin'])) {
  window.location.href = 'dashboard.html';
}
renderSidebar();
renderTopbar('Proveedores');
cargarProveedores();

let editandoId = null;

async function cargarProveedores() {
  const contenedor = document.getElementById('tabla-proveedores');
  UI.spinner(contenedor);
  const soloActivos = document.getElementById('chk-activos').checked;
  try {
    const provs = await Api.get('/proveedores' + (soloActivos ? '?activos=true' : ''));

    if (!provs.length) { UI.empty(contenedor, 'No hay proveedores registrados'); return; }

    contenedor.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nombre</th><th>Email</th><th>Teléfono</th>
            <th>RFC</th><th>Estado</th><th>Acciones</th>
          </tr></thead>
          <tbody>${provs.map(p => `
            <tr>
              <td class="fw-600">${p.nombre}</td>
              <td>${p.email}</td>
              <td>${p.telefono || '—'}</td>
              <td>${p.rfc || '—'}</td>
              <td>${p.activo
                    ? '<span class="badge badge-aprobado">Activo</span>'
                    : '<span class="badge badge-rechazado">Inactivo</span>'}</td>
              <td>
                <div class="d-flex gap-2">
                  <button class="btn btn-sm btn-outline"
                          onclick="abrirModalProveedor(${p.id})">Editar</button>
                  ${Auth.puedeHacer(['admin'])
                    ? `<button class="btn btn-sm ${p.activo ? 'btn-danger' : 'btn-success'}"
                               onclick="toggleActivo(${p.id}, ${p.activo})">
                         ${p.activo ? 'Desactivar' : 'Activar'}</button>`
                    : ''}
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (err) {
    UI.empty(contenedor, 'Error al cargar proveedores');
    Toast.error(err.mensaje || 'Error');
  }
}

async function abrirModalProveedor(id = null) {
  editandoId = id;
  document.getElementById('modal-prov-titulo').textContent =
    id ? 'Editar proveedor' : 'Nuevo proveedor';
  document.getElementById('form-proveedor').reset();

  if (id) {
    try {
      const p = await Api.get(`/proveedores/${id}`);
      document.getElementById('prov-nombre').value    = p.nombre;
      document.getElementById('prov-email').value     = p.email;
      document.getElementById('prov-telefono').value  = p.telefono || '';
      document.getElementById('prov-rfc').value       = p.rfc || '';
      document.getElementById('prov-direccion').value = p.direccion || '';
    } catch { Toast.error('Error al cargar proveedor'); return; }
  }
  UI.abrirModal('modal-proveedor');
}

document.getElementById('form-proveedor').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-guardar-prov');
  btn.disabled = true;
  const datos = {
    nombre:    document.getElementById('prov-nombre').value,
    email:     document.getElementById('prov-email').value,
    telefono:  document.getElementById('prov-telefono').value || null,
    rfc:       document.getElementById('prov-rfc').value || null,
    direccion: document.getElementById('prov-direccion').value || null,
  };

  try {
    if (editandoId) {
      await Api.put(`/proveedores/${editandoId}`, datos);
      Toast.success('Proveedor actualizado');
    } else {
      await Api.post('/proveedores', datos);
      Toast.success('Proveedor creado');
    }
    UI.cerrarModal('modal-proveedor');
    cargarProveedores();
  } catch (err) {
    Toast.error(err.mensaje || 'Error al guardar');
  } finally {
    btn.disabled = false;
  }
});

async function toggleActivo(id, activo) {
  try {
    await Api.patch(`/proveedores/${id}/estado`, { activo: !activo });
    Toast.success(`Proveedor ${!activo ? 'activado' : 'desactivado'}`);
    cargarProveedores();
  } catch (err) {
    Toast.error(err.mensaje || 'Error');
  }
}
</script>
</body>
</html>
