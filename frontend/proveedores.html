<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">
      <div class="card">
        <div class="d-flex align-center justify-between" style="margin-bottom:16px">
          <div class="card-title mb-0">Proveedores</div>
          <div class="d-flex gap-2">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">
              <input type="checkbox" id="chk-activos" checked onchange="cargarProveedores()">
              Solo activos
            </label>
            <button class="btn btn-outline btn-sm"
                    onclick="document.getElementById('input-excel-proveedores').click()">
              📥 Cargar desde Excel
            </button>
            <button class="btn btn-primary btn-sm"
                    onclick="abrirModalProveedor()">+ Nuevo proveedor</button>
          </div>
          <input type="file" id="input-excel-proveedores" accept=".xlsx,.xls" style="display:none" onchange="cargarProveedoresDesdeExcel(this)">
        </div>

        <div id="tabla-proveedores"></div>
      </div>
    </main>
  </div>
</div>

<!-- ── Modal: Proveedor ───────────────────────────────────────── -->
<div class="modal-backdrop" id="modal-proveedor">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-prov-titulo">Nuevo proveedor</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-proveedor')">×</button>
    </div>
    <form id="form-proveedor">
      <div style="display:grid;grid-template-columns:140px 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label">No. Proveedor *</label>
          <input type="text" id="prov-numero" class="form-control" required
                 maxlength="5" inputmode="numeric" pattern="\d{5}"
                 placeholder="00001" title="5 dígitos numéricos">
          <small class="text-danger" id="error-prov-numero"></small>
        </div>
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input type="text" id="prov-nombre" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Correo electrónico *</label>
        <input type="email" id="prov-email" class="form-control" required>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="text" id="prov-telefono" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">RFC</label>
          <input type="text" id="prov-rfc" class="form-control" maxlength="13">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Dirección</label>
        <textarea id="prov-direccion" class="form-control" rows="2"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline"
                onclick="UI.cerrarModal('modal-proveedor')">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-prov">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/pages/proveedores.js"></script>
</body>
</html>
