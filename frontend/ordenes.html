<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes de Compra — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">

      <!-- ── Lista ─────────────────────────────────────────── -->
      <div id="vista-lista">
        <div class="card">
          <div class="card-title">Órdenes de Compra</div>
          <div id="oc-subtitle" style="font-size:13px;color:#64748b;margin-top:-4px;margin-bottom:8px;"></div>

          <div class="filters-bar">
            <select id="fil-estado" class="form-control">
              <option value="">Todos los estados</option>
              <option value="generada">Generada</option>
              <option value="distribuida">Distribuida</option>
              <option value="en_proceso">En proceso</option>
              <option value="recibida">Recibida</option>
              <option value="cerrada">Cerrada</option>
              <option value="cancelada">Cancelada</option>
            </select>
            <button class="btn btn-outline btn-sm" onclick="cargarOrdenes(1)">Filtrar</button>
          </div>

          <div id="tabla-oc"></div>
          <div id="paginacion-oc"></div>
        </div>
      </div>

      <!-- ── Detalle ────────────────────────────────────────── -->
      <div id="vista-detalle" style="display:none">
        <div class="d-flex align-center gap-2" style="margin-bottom:16px">
          <button class="btn btn-outline btn-sm" onclick="volverLista()">← Volver</button>
          <h2 style="margin:0;font-size:16px" id="detalle-titulo">Orden de Compra</h2>
        </div>

        <div class="two-column-layout">
          <div>
            <div class="card" id="detalle-info"></div>
            <div class="card" id="detalle-recepciones">
              <div class="d-flex align-center justify-between" style="margin-bottom:14px">
                <div class="card-title mb-0">Recepciones</div>
                <button class="btn btn-sm btn-outline" id="btn-nueva-recepcion"
                        onclick="UI.abrirModal('modal-recepcion')">+ Registrar recepción</button>
              </div>

              <!-- Resumen de Avance para Cierre -->
              <div id="resumen-avance-oc" style="margin-bottom:16px; padding:12px 14px; background:#f1f5f9; border-radius:6px; font-size:13px; border-left:4px solid #185FA5;"></div>

              <div id="lista-recepciones"></div>
            </div>
          </div>

          <div>
            <div class="card" id="panel-acciones"></div>
            <div class="card">
              <div class="card-title">Historial</div>
              <div class="timeline" id="historial-timeline"></div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ── Modal: Cambiar estado ──────────────────────────────────── -->
<div class="modal-backdrop" id="modal-estado">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-estado-titulo">Cambiar estado</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-estado')">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Notas (opcional)</label>
      <textarea id="estado-notas" class="form-control" rows="3"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="UI.cerrarModal('modal-estado')">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-estado">Confirmar</button>
    </div>
  </div>
</div>

<!-- ── Modal: Registrar recepción ─────────────────────────────── -->
<div class="modal-backdrop" id="modal-recepcion">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title">Registrar recepción</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-recepcion')">×</button>
    </div>
    <form id="form-recepcion">
      <div class="form-group">
        <label class="form-label">Estado de recepción</label>
        <select id="rec-estado" class="form-control">
          <option value="recibido_completo">Recibido completo</option>
          <option value="recibido_parcial">Recibido parcial</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Transacción / ID en DataTextNow (opcional)</label>
        <input type="text" id="rec-datatextnow" class="form-control" placeholder="Ej. 000000001158426 (del reporte Stock Transactions)">
      </div>
      <div id="rec-aviso-cierre" style="display:none; margin-bottom:12px; padding:10px 12px; border-radius:6px; background:#fffbeb; border:1px solid #fde047; font-size:13px; color:#854d0e;"></div>
      <div class="form-group">
        <label class="form-label">Notas</label>
        <textarea id="rec-notas" class="form-control" rows="2"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline"
                onclick="UI.cerrarModal('modal-recepcion')">Cancelar</button>
        <button type="submit" class="btn btn-success">Confirmar recepción</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/pages/ordenes.js"></script>
</body>
</html>
