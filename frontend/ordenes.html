<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes de Compra — Sistema OC</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app-layout">
  <aside id="sidebar"></aside>

  <div style="flex:1">
    <header id="topbar"></header>

    <main id="main-content">

      <!-- ── Lista ─────────────────────────────────────────── -->
      <div id="vista-lista">
        <div class="card">
          <div class="page-header">
            <div>
              <h2 class="page-title">Órdenes de Compra</h2>
              <p class="page-subtitle" id="oc-subtitle"></p>
            </div>
            <div class="page-header-actions" id="oc-admin-actions" style="display:none;">
              <button type="button" id="btn-exportar-oc" class="btn btn-outline btn-sm"
                      onclick="exportarOrdenesExcel(this)"
                      title="Exportar OC completa o por año en layout BASE GRAL">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Exportar Excel
              </button>
            </div>
          </div>

          <div class="filters-bar">
            <div class="search-wrap">
              <svg class="search-icon" width="14" height="14" fill="none"
                   stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="search" id="fil-busqueda-oc" class="form-control search-input"
                     placeholder="Buscar por OC, PO, req. o proveedor…">
            </div>
            <select id="fil-estado" class="form-control">
              <option value="">Todos los estados</option>
              <option value="activas">Activas / no concluidas</option>
              <option value="generada">Generada</option>
              <option value="distribuida">Distribuida</option>
              <option value="en_proceso">En proceso</option>
              <option value="recibida">Recibida</option>
              <option value="cerrada">Cerrada</option>
              <option value="cancelada">Cancelada</option>
            </select>
            <select id="fil-tipo" class="form-control">
              <option value="">Todos los tipos</option>
              <option value="PARTES">Partes</option>
              <option value="SERVICIOS">Servicios</option>
              <option value="FLETES">Fletes</option>
            </select>
            <select id="fil-solicitante-oc" class="form-control" style="display:none;min-width:180px"
                    title="Filtrar por solicitante">
              <option value="">Todos los usuarios</option>
            </select>
            <label class="chk-label" style="white-space:nowrap">
              <input type="checkbox" id="fil-sin-po" onchange="cargarOrdenes(1)">
              Sin PO / NA
            </label>
            <button class="btn btn-outline btn-sm" onclick="cargarOrdenes(1)">Filtrar</button>
          </div>

          <div id="tabla-oc"></div>
          <div id="paginacion-oc" class="pagination-bar" aria-label="Paginación de órdenes"></div>
        </div>
      </div>

      <!-- ── Detalle ────────────────────────────────────────── -->
      <div id="vista-detalle" style="display:none">
        <div class="d-flex align-center gap-2" style="margin-bottom:16px">
          <button class="btn btn-outline btn-sm" onclick="volverLista()">← Volver</button>
          <h2 style="margin:0;font-size:16px" id="detalle-titulo">Orden de Compra</h2>
        </div>

        <div class="two-column-layout">
          <div>
            <div class="card" id="detalle-info"></div>
            <div class="card" id="detalle-recepciones">
              <div class="d-flex align-center justify-between" style="margin-bottom:14px">
                <div class="card-title mb-0">Entregas</div>
                <button class="btn btn-sm btn-outline" id="btn-nueva-recepcion"
                        onclick="abrirRecepcion()">+ Registrar entrega</button>
              </div>

              <!-- Resumen de Avance para Cierre -->
              <div id="resumen-avance-oc" style="margin-bottom:16px; padding:12px 14px; background:#f1f5f9; border-radius:6px; font-size:13px; border-left:4px solid #185FA5;"></div>

              <div id="lista-recepciones"></div>
            </div>
          </div>

          <div>
            <div class="card" id="panel-acciones"></div>
            <div class="card">
              <div class="card-title">Historial</div>
              <div class="timeline" id="historial-timeline"></div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ── Modal: Cambiar estado ──────────────────────────────────── -->
<div class="modal-backdrop" id="modal-estado">
  <div class="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-estado-titulo">Cambiar estado</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-estado')">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Notas (opcional)</label>
      <textarea id="estado-notas" class="form-control" rows="3"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="UI.cerrarModal('modal-estado')">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-estado">Confirmar</button>
    </div>
  </div>
</div>

<!-- ── Modal: Registrar recepción ─────────────────────────────── -->
<div class="modal-backdrop" id="modal-recepcion">
  <div class="modal-box" style="max-width: 720px;">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-recepcion-titulo">Registrar recepción</h3>
      <button class="modal-close" onclick="cerrarModalRecepcion()">×</button>
    </div>
    <form id="form-recepcion" novalidate>
      <input type="hidden" id="rec-id" value="">
      <div class="form-group">
        <label class="form-label">Ítems recibidos en esta entrega</label>
        <div id="rec-items-loading" class="text-muted text-sm" style="display:none;">Cargando ítems…</div>
        <div id="rec-items-list" style="max-height:280px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:6px;"></div>
        <div id="rec-estado-auto" style="margin-top:8px; font-size:12.5px; min-height:18px;"></div>
      </div>
      <div id="rec-aviso-cierre" style="display:none; margin-bottom:12px; padding:10px 12px; border-radius:6px; background:#fffbeb; border:1px solid #fde047; font-size:13px; color:#854d0e;"></div>
      <div class="form-group">
        <label class="form-label">Notas</label>
        <textarea id="rec-notas" class="form-control" rows="2"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="cerrarModalRecepcion()">Cancelar</button>
        <button type="submit" class="btn btn-success" id="btn-guardar-recepcion">Confirmar recepción</button>
      </div>
    </form>
  </div>
</div>

<!-- ── Modal: Cierre anticipado ────────────────────────────────── -->
<div class="modal-backdrop" id="modal-cierre-anticipado">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-header">
      <h3 class="modal-title">Cerrar OC con ítems incompletos</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-cierre-anticipado')">×</button>
    </div>
    <div id="cierre-anticipado-pendientes"></div>
    <div class="form-group">
      <label class="form-label">PO DataTextNow <span style="color:#dc2626;font-weight:700">*</span></label>
      <input type="text" id="cierre-po" class="form-control" placeholder="Requerido para cerrar la OC">
    </div>
    <div class="form-group">
      <label class="form-label">Motivo de cierre anticipado</label>
      <textarea id="cierre-notas" class="form-control" rows="2"
        placeholder="Ej: Proveedor sin existencia del resto, se acepta entrega parcial…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="UI.cerrarModal('modal-cierre-anticipado')">Cancelar</button>
      <button class="btn btn-primary" id="btn-confirmar-cierre-anticipado">Cerrar OC de todas formas</button>
    </div>
  </div>
</div>

<!-- ── Modal: Editar ítem de catálogo desde OC ─────────────────── -->
<div class="modal-backdrop" id="modal-editar-item-proveedor">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-header">
      <h3 class="modal-title">Editar datos del ítem</h3>
      <button class="modal-close" onclick="UI.cerrarModal('modal-editar-item-proveedor')">×</button>
    </div>
    <div id="editar-item-desc" style="font-size:13px;color:#475569;margin-bottom:16px;padding:10px;background:#f8fafc;border-radius:6px;"></div>
    <div class="form-group">
      <label class="form-label">Proveedor</label>
      <input type="text" id="editar-item-proveedor-busqueda" class="form-control"
             list="editar-item-proveedores-list"
             placeholder="Buscar por código o nombre…"
             autocomplete="off">
      <input type="hidden" id="editar-item-proveedor-id">
      <datalist id="editar-item-proveedores-list"></datalist>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="form-group">
        <label class="form-label">Precio unitario</label>
        <input type="number" id="editar-item-precio" class="form-control" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label class="form-label">Unidad</label>
        <input type="text" id="editar-item-unidad" class="form-control" placeholder="Ej. pieza, kg, hr">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="UI.cerrarModal('modal-editar-item-proveedor')">Cancelar</button>
      <button class="btn btn-primary" id="btn-guardar-item-proveedor">Guardar</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/app.js"></script>
<script src="js/proveedor-busqueda.js"></script>
<script src="js/pages/ordenes.js"></script>
</body>
</html>
